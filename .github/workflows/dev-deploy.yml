name: Build and Push Docker Image

on:
  push:
    branches:
      - dev

jobs:
  docker:
    permissions:
      contents: read
      packages: write

    uses: java-taxi-microservices/devops/.github/workflows/dev-deploy.yaml@main

    with:
      image_name: ${{ github.event.repository.name }}

    secrets:
      ghcr_pat: ${{ secrets.GHCR_PAT }}
